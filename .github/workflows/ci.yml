name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cumulore
          POSTGRES_USER: cumulore
          POSTGRES_PASSWORD: cumulore_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cumulore -d cumulore"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: pnpm verify
      - run: pnpm db:migrate && pnpm test:integration
        env:
          DATABASE_URL: postgresql://cumulore:cumulore_local_only@localhost:5432/cumulore
