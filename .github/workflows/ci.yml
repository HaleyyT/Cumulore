name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cumulore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - run: python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
      - run: pnpm verify
      - run: pnpm build:production
      - run: pnpm audit
      - run: python -m pip_audit --strict -r requirements.lock
      - run: python -m pip_audit --strict -r requirements-dev.lock
      - run: pnpm test:integration:isolated
      - name: Production-only package install smoke
        run: |
          pnpm --filter @cumulore/database deploy --prod --legacy "$RUNNER_TEMP/cumulore-database-production"
          cd "$RUNNER_TEMP/cumulore-database-production"
          node --input-type=module -e 'const pg = await import("pg"); if (typeof pg.default?.Pool !== "function" && typeof pg.Pool !== "function") process.exit(1)'
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
